<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

/* VIDEO SLIDER */

.videos {
    width: 100vw;
    height: 100vh;

    display: flex;

    overflow-x: auto;
    overflow-y: hidden;

    scroll-snap-type: x mandatory;
    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;
}

.videos::-webkit-scrollbar {
    display: none;
}

/* EACH VIDEO */

.video-page {
    flex: 0 0 100vw;

    width: 100vw;
    height: 100vh;

    scroll-snap-align: start;

    display: flex;
    justify-content: center;
    align-items: center;

    background: black;

    position: relative;
}

/* VIDEO */

.video-page video {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: black;

    display: block;
}

/* TITLE */

.title {
    position: absolute;

    top: 25px;
    left: 0;

    width: 100%;

    text-align: center;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 24px;

    font-weight: bold;

    z-index: 10;

    text-shadow:
        0 2px 8px black,
        0 2px 15px black;

    pointer-events: none;
}

/* SOUND BUTTON */

.soundButton {
    position: fixed;

    top: 25px;
    right: 20px;

    z-index: 50;

    border: none;

    background: rgba(0, 0, 0, 0.65);

    color: white;

    padding: 11px 17px;

    border-radius: 25px;

    font-size: 14px;

    cursor: pointer;

    backdrop-filter: blur(5px);
}

/* SWIPE TEXT */

.swipe {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    color: white;

    font-family: Arial, sans-serif;

    font-size: 14px;

    z-index: 20;

    opacity: 0.8;

    pointer-events: none;

    text-shadow: 0 2px 5px black;

    animation: fade 2s infinite;
}

@keyframes fade {

    0%, 100% {
        opacity: 0.3;
    }

    50% {
        opacity: 1;
    }

}

</style>

<script>

const container = document.getElementById("videos");

const videos = document.querySelectorAll(".video-page video");

let soundOn = false;


/* STOP ALL OTHER VIDEOS */

function stopOthers(currentVideo) {

    videos.forEach(function(video) {

        if (video !== currentVideo) {
            video.pause();
        }

    });

}


/* TURN SOUND ON AFTER FIRST CLICK */

videos.forEach(function(video) {

    video.addEventListener("click", function() {

        if (!soundOn) {

            soundOn = true;

            videos.forEach(function(v) {
                v.muted = false;
            });

            video.muted = false;

            video.play().catch(function() {});

        }

    });

});


/* PLAY CURRENT VIDEO */

const observer = new IntersectionObserver(

    function(entries) {

        entries.forEach(function(entry) {

            if (entry.isIntersecting) {

                const video = entry.target;

                stopOthers(video);

                if (soundOn) {

                    video.muted = false;

                } else {

                    video.muted = true;

                }

                video.play().catch(function() {});

            }

            else {

                entry.target.pause();

            }

        });

    },

    {
        root: container,
        threshold: 0.75
    }

);


/* OBSERVE ALL VIDEOS */

videos.forEach(function(video) {

    observer.observe(video);

});


/* KEEP SOUND ON */

videos.forEach(function(video) {

    video.addEventListener("play", function() {

        stopOthers(video);

        if (soundOn) {
            video.muted = false;
        }

    });

});

</script>
