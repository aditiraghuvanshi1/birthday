<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #ffeef5, #ffc2d9);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* Main content */
.container {
    position: relative;
    z-index: 10;
    width: 100%;
    padding: 20px;
}

/* Cake */
.cake {
    position: relative;
    width: 190px;
    height: 130px;
    margin: 20px auto 50px;
}

/* Cake layers */
.layer1 {
    position: absolute;
    bottom: 0;
    width: 190px;
    height: 65px;
    background: #ff8fab;
    border-radius: 12px 12px 20px 20px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.15);
}

.layer2 {
    position: absolute;
    bottom: 50px;
    left: 20px;
    width: 150px;
    height: 55px;
    background: #ffb3c6;
    border-radius: 12px 12px 18px 18px;
}

.cream {
    position: absolute;
    bottom: 88px;
    left: 20px;
    width: 150px;
    height: 20px;
    background: #fff;
    border-radius: 20px;
}

/* Candle */
.candle {
    position: absolute;
    bottom: 108px;
    left: 86px;
    width: 18px;
    height: 55px;
    background: #fff;
    border-radius: 5px;
}

.flame {
    position: absolute;
    top: -28px;
    left: 2px;
    width: 14px;
    height: 25px;
    background: #ffb703;
    border-radius: 50% 50% 50% 50%;
    animation: flicker 0.5s infinite alternate;
}

@keyframes flicker {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.2);
    }
}

/* Instruction */
.instruction {
    font-size: 17px;
    color: #8b3655;
    margin-top: -20px;
}

/* Birthday message */
.message {
    display: none;
    animation: pop 1s ease;
}

.message h1 {
    font-size: clamp(35px, 9vw, 65px);
    color: #e63973;
    text-shadow: 0 4px 10px rgba(230,57,115,0.25);
    margin-bottom: 10px;
}

.message p {
    font-size: 20px;
    color: #8b3655;
    margin-bottom: 25px;
}

@keyframes pop {
    0% {
        transform: scale(0);
        opacity: 0;
    }

    70% {
        transform: scale(1.1);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* Buttons */
.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 13px 20px;
    border-radius: 30px;
    background: #e63973;
    color: white;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(230,57,115,0.3);
}

button:hover {
    transform: scale(1.05);
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    z-index: 2;
    animation: floatHeart linear forwards;
}

@keyframes floatHeart {

    0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    50% {
        transform: translateY(-50vh) rotate(15deg) scale(1);
    }

    100% {
        transform: translateY(-115vh) rotate(-15deg) scale(1.2);
        opacity: 0;
    }
}

/* Floating kisses */
.kiss {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    z-index: 3;
    animation: floatKiss linear forwards;
}

@keyframes floatKiss {

    0% {
        transform: translateY(0) rotate(0deg) scale(0.6);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    50% {
        transform: translateY(-50vh) rotate(12deg) scale(1);
    }

    100% {
        transform: translateY(-115vh) rotate(-12deg) scale(1.15);
        opacity: 0;
    }
}

/* Sparkles */
.sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 4;
    animation: sparkle 2.5s ease-out forwards;
}

@keyframes sparkle {

    0% {
        transform: scale(0) rotate(0deg);
        opacity: 0;
    }

    30% {
        transform: scale(1.3) rotate(90deg);
        opacity: 1;
    }

    70% {
        opacity: 1;
    }

    100% {
        transform: scale(0.2) rotate(180deg);
        opacity: 0;
    }
}

/* Mobile */
@media (max-width: 500px) {

    .cake {
        transform: scale(0.85);
        margin-bottom: 35px;
    }

    .message h1 {
        font-size: 38px;
    }

    .message p {
        font-size: 17px;
    }

    button {
        padding: 12px 16px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="cake">

        <div class="layer1"></div>
        <div class="layer2"></div>
        <div class="cream"></div>

        <div class="candle">
            <div class="flame" id="flame"></div>
        </div>

    </div>

    <div class="instruction" id="instruction">
        Tap anywhere to blow the candle 🕯️
    </div>

    <div class="message" id="message">

        <h1>HAPPY BIRTHDAY MY LovE! 🎂</h1>

        <p>❤️ Today is all about you ❤️</p>

        <div class="buttons">

            <button onclick="goToLetter()">
                💌 Open My Letter
            </button>

            <button onclick="goToVideos()">
                🎀 Cutee Stuff
            </button>

        </div>

    </div>

</div>

<script>

/* Candle blow */
let candleBlown = false;

document.body.addEventListener("click", function(event) {

    /* Don't trigger candle when clicking buttons */
    if (event.target.closest("button")) {
        return;
    }

    if (candleBlown) {
        return;
    }

    candleBlown = true;

    document.getElementById("flame").style.display = "none";
    document.getElementById("instruction").style.display = "none";

    document.getElementById("message").style.display = "block";

    startEffects();

});


/* Floating hearts */
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = [
        "❤️",
        "💗",
        "💖",
        "💕",
        "💓",
        "💞"
    ];

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (18 + Math.random() * 22) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);
}


/* 😘💋 Floating kisses */
function createKiss() {

    const kiss = document.createElement("div");

    kiss.className = "kiss";

    const kisses = [
        "😘",
        "💋",
        "😘",
        "💋"
    ];

    kiss.innerHTML =
        kisses[Math.floor(Math.random() * kisses.length)];

    kiss.style.left = Math.random() * 100 + "vw";

    kiss.style.fontSize =
        (22 + Math.random() * 14) + "px";

    kiss.style.animationDuration =
        (5 + Math.random() * 4) + "s";

    document.body.appendChild(kiss);

    setTimeout(() => {
        kiss.remove();
    }, 10000);
}


/* ✨ Sparkles */
function createSparkle() {

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";

    const sparkles = [
        "✨",
        "💫",
        "⭐",
        "✦",
        "⋆"
    ];

    sparkle.innerHTML =
        sparkles[Math.floor(Math.random() * sparkles.length)];

    sparkle.style.left =
        Math.random() * 100 + "vw";

    sparkle.style.top =
        Math.random() * 100 + "vh";

    sparkle.style.fontSize =
        (14 + Math.random() * 15) + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => {
        sparkle.remove();
    }, 3000);
}


/* Start everything after candle is blown */
function startEffects() {

    /* Hearts */
    for (let i = 0; i < 12; i++) {
        setTimeout(createHeart, i * 150);
    }

    setInterval(createHeart, 500);


    /* Kisses */
    for (let i = 0; i < 5; i++) {
        setTimeout(createKiss, i * 400);
    }

    setInterval(createKiss, 1300);


    /* Sparkles */
    for (let i = 0; i < 15; i++) {
        setTimeout(createSparkle, i * 100);
    }

    setInterval(createSparkle, 350);
}


/* Navigation */
function goToLetter() {
    window.location.href = "letter.html";
}

function goToVideos() {
    window.location.href = "video1.html";
}

</script>

</body>
</html>
